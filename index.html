        </div>

          <i class="fa-solid fa-rotate-left mr-1"></i> Reset
        </button>
      </div>
    </div>
  </section>

      { id: "boisestate", name: "Boise State University", city: "Boise", state: "ID", conference: "Mountain West", mens: false, womens: true, stadium: "Boas Soccer Complex", capacity: 750, surface: "Grass", mensStats: null, womensStats: { confTitles: 2, ncaaApps: 2, ncaaTitles: 0 } },
      { id: "utahstate", name: "Utah State University", city: "Logan", state: "UT", conference: "Mountain West", mens: false, womens: true, stadium: "Chuck & Gloria Bell Soccer Field", capacity: 500, surface: "Grass", mensStats: null, womensStats: { confTitles: 4, ncaaApps: 4, ncaaTitles: 0 } },
      { id: "northernarizona", name: "Northern Arizona University", city: "Flagstaff", state: "AZ", conference: "Big Sky", mens: false, womens: true, stadium: "Max Spilsbury Field", capacity: 1000, surface: "Grass", mensStats: null, womensStats: { confTitles: 4, ncaaApps: 4, ncaaTitles: 0 } },
      { id: "montana", name: "University of Montana", city: "Missoula", state: "MT", conference: "Big Sky", mens: false, womens: true, stadium: "South Campus Stadium", capacity: 1200, surface: "Grass", mensStats: null, womensStats: { confTitles: 6, ncaaApps: 6, ncaaTitles: 0 } }
    ];

    // State Variables
    let currentGender = 'ALL';
    let currentState = 'ALL';
    let currentSearch = '';

    // DOM Elements
    const searchInput = document.getElementById('search-input');
    const stateFilter = document.getElementById('state-filter');
    const totalProgramsCount = document.getElementById('total-programs-count');
    const totalConferencesCount = document.getElementById('total-conferences-count');
    const mensCountEl = document.getElementById('mens-count');
    const womensCountEl = document.getElementById('womens-count');
    const resetFiltersBtn = document.getElementById('reset-filters');
    const conferenceChipsEl = document.getElementById('conference-chips');
    const conferenceSectionsEl = document.getElementById('conference-sections');

    // Initialize App
    window.onload = function() {
      updateMetrics();
      populateStateDropdown();
      renderConferenceChips();
      renderDashboard();

      // Setup Event Listeners
      searchInput.addEventListener('input', (e) => {
        currentSearch = e.target.value.toLowerCase().trim();
        renderDashboard();
      });

      stateFilter.addEventListener('change', (e) => {
        currentState = e.target.value;
        renderDashboard();
      });

      // Gender Buttons
      document.getElementById('btn-gender-all').addEventListener('click', (e) => setGenderFilter('ALL', e.target));
      document.getElementById('btn-gender-men').addEventListener('click', (e) => setGenderFilter('MEN', e.target));
      document.getElementById('btn-gender-women').addEventListener('click', (e) => setGenderFilter('WOMEN', e.target));

      resetFiltersBtn.addEventListener('click', resetFilters);
    };

    // Populate State Filter Dropdown
    function populateStateDropdown() {
      const states = [...new Set(D1_SOCCER_PROGRAMS.map(p => p.state))].sort();
      states.forEach(st => {
        const option = document.createElement('option');
        option.value = st;
        option.textContent = `State: ${st}`;
        stateFilter.appendChild(option);
      });
    }

    // Set Gender Filter
    function setGenderFilter(gender, btnElement) {
      currentGender = gender;
      document.querySelectorAll('.gender-btn').forEach(b => {
        b.classList.remove('bg-white', 'text-brand-800', 'shadow-sm');
        b.classList.add('text-slate-600');
      });
      btnElement.classList.add('bg-white', 'text-brand-800', 'shadow-sm');
      btnElement.classList.remove('text-slate-600');
      renderDashboard();
    }

    // Reset Filters
    function resetFilters() {
      currentSearch = '';
      currentGender = 'ALL';
      currentState = 'ALL';
      searchInput.value = '';
      stateFilter.value = 'ALL';
      setGenderFilter('ALL', document.getElementById('btn-gender-all'));
    }

    // Header Metrics
    function updateMetrics() {
      let mensTotal = 0;
      let womensTotal = 0;
      const confSet = new Set();

      D1_SOCCER_PROGRAMS.forEach(p => {
        if (p.mens) mensTotal++;
        if (p.womens) womensTotal++;
        confSet.add(p.conference);
      });

      totalProgramsCount.textContent = D1_SOCCER_PROGRAMS.length;
      totalConferencesCount.textContent = confSet.size;
      mensCountEl.textContent = mensTotal;
      womensCountEl.textContent = womensTotal;
    }

    // Render Jump-to Chips
    function renderConferenceChips() {
      const conferences = [...new Set(D1_SOCCER_PROGRAMS.map(p => p.conference))].sort();
      conferenceChipsEl.innerHTML = '';

      conferences.forEach(conf => {
        const chip = document.createElement('a');
        chip.href = `#conf-${conf.replace(/\s+/g, '-').toLowerCase()}`;
        chip.className = "px-3 py-1.5 bg-white hover:bg-brand-500 hover:text-white border border-brand-200 text-brand-800 font-semibold text-xs rounded-xl transition-all shadow-sm";
        chip.textContent = conf;
        conferenceChipsEl.appendChild(chip);
      });
    }

    // Filter Logic
    function getFilteredPrograms() {
      return D1_SOCCER_PROGRAMS.filter(program => {
        if (currentGender === 'MEN' && !program.mens) return false;
        if (currentGender === 'WOMEN' && !program.womens) return false;
        if (currentState !== 'ALL' && program.state !== currentState) return false;

        if (currentSearch !== '') {
          const nameMatch = program.name.toLowerCase().includes(currentSearch);
          const cityMatch = program.city.toLowerCase().includes(currentSearch);
          const stateMatch = program.state.toLowerCase().includes(currentSearch);
          const stadiumMatch = program.stadium.toLowerCase().includes(currentSearch);
          const confMatch = program.conference.toLowerCase().includes(currentSearch);
          if (!nameMatch && !cityMatch && !stateMatch && !stadiumMatch && !confMatch) return false;
        }

        return true;
      });
    }

    // Main Render Loop Grouped by Conference
    function renderDashboard() {
      const filtered = getFilteredPrograms();
      conferenceSectionsEl.innerHTML = '';

      if (filtered.length === 0) {
        conferenceSectionsEl.innerHTML = `
          <div class="bg-white rounded-2xl p-12 text-center text-slate-400 border border-brand-100 shadow-sm">
            <i class="fa-solid fa-futbol text-4xl mb-3 text-brand-200"></i>
            <h3 class="text-lg font-bold text-slate-700 mb-1">No Programs Found</h3>
            <p class="text-xs">Try adjusting your search query, state, or gender filter.</p>
          </div>
        `;
        return;
      }

      // Group by Conference
      const grouped = {};
      filtered.forEach(program => {
        if (!grouped[program.conference]) {
          grouped[program.conference] = [];
        }
        grouped[program.conference].push(program);
      });

      // Render each conference section
      Object.keys(grouped).sort().forEach(conf => {
        const teams = grouped[conf];
        const sectionId = `conf-${conf.replace(/\s+/g, '-').toLowerCase()}`;

        const section = document.createElement('section');
        section.id = sectionId;
        section.className = "bg-white rounded-2xl border border-brand-100 shadow-sm overflow-hidden p-6 space-y-4 scroll-mt-[150px]";

        section.innerHTML = `
          <div class="flex items-center justify-between border-b border-brand-100 pb-4">
            <div class="flex items-center gap-3">
              <div class="bg-brand-100 text-brand-700 px-3 py-1 rounded-xl text-sm font-black uppercase tracking-wider">
                ${conf}
              </div>
              <h2 class="text-xl font-bold text-slate-900">${conf} Conference</h2>
            </div>
            <span class="bg-brand-50 text-brand-700 px-2.5 py-1 rounded-full text-xs font-bold border border-brand-100">
              ${teams.length} ${teams.length === 1 ? 'Team' : 'Teams'}
            </span>
          </div>

          <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
            ${teams.map(p => `
              <div class="bg-brand-50/60 hover:bg-brand-50 border border-brand-100 hover:border-brand-300 rounded-xl p-4 transition-all hover:shadow-md flex flex-col justify-between space-y-3">
                <div>
                  <div class="flex items-center justify-between gap-2 mb-1.5">
                    <h3 class="font-bold text-slate-900 text-base leading-snug">${p.name}</h3>
                  </div>
                  <div class="text-xs text-slate-500 space-y-1">
                    <p class="flex items-center gap-1.5">
                      <i class="fa-solid fa-location-dot text-brand-500 w-4"></i>
                      <span>${p.city}, ${p.state}</span>
                    </p>
                    <p class="flex items-center gap-1.5">
                      <i class="fa-solid fa-stadium text-slate-400 w-4"></i>
                      <span class="font-semibold text-slate-700">${p.stadium}</span>
                    </p>
                  </div>

                  <!-- Program Accolades & Championship History -->
                  <div class="mt-3 pt-3 border-t border-brand-200/60 space-y-2 text-[11px]">
                    ${p.mens && p.mensStats ? `
                      <div class="bg-white/80 p-2 rounded-lg border border-brand-100 space-y-1">
                        <div class="font-bold text-sky-900 flex items-center justify-between">
                          <span class="flex items-center gap-1">
                            <i class="fa-solid fa-mars text-sky-600"></i> Men's History
                          </span>
                          ${p.mensStats.ncaaTitles > 0 ? `<span class="bg-amber-100 text-amber-800 text-[9px] font-extrabold px-1.5 py-0.5 rounded flex items-center gap-1"><i class="fa-solid fa-trophy text-amber-500"></i> ${p.mensStats.ncaaTitles} NCAA Title${p.mensStats.ncaaTitles > 1 ? 's' : ''}</span>` : ''}
                        </div>
                        <div class="flex items-center justify-between text-slate-600">
                          <span>Conf. Titles: <strong class="text-slate-800">${p.mensStats.confTitles}</strong></span>
                          <span>NCAA Apps: <strong class="text-slate-800">${p.mensStats.ncaaApps}</strong></span>
                        </div>
                      </div>
                    ` : ''}

                    ${p.womens && p.womensStats ? `
                      <div class="bg-white/80 p-2 rounded-lg border border-brand-100 space-y-1">
                        <div class="font-bold text-indigo-900 flex items-center justify-between">
                          <span class="flex items-center gap-1">
                            <i class="fa-solid fa-venus text-indigo-600"></i> Women's History
                          </span>
                          ${p.womensStats.ncaaTitles > 0 ? `<span class="bg-amber-100 text-amber-800 text-[9px] font-extrabold px-1.5 py-0.5 rounded flex items-center gap-1"><i class="fa-solid fa-trophy text-amber-500"></i> ${p.womensStats.ncaaTitles} NCAA Title${p.womensStats.ncaaTitles > 1 ? 's' : ''}</span>` : ''}
                        </div>
                        <div class="flex items-center justify-between text-slate-600">
                          <span>Conf. Titles: <strong class="text-slate-800">${p.womensStats.confTitles}</strong></span>
                          <span>NCAA Apps: <strong class="text-slate-800">${p.womensStats.ncaaApps}</strong></span>
                        </div>
                      </div>
                    ` : ''}
                  </div>
                </div>

                <div class="pt-2 border-t border-brand-100 flex items-center justify-between text-xs">
                  <div class="flex gap-1.5">
                    ${p.mens ? '<span class="bg-sky-100 text-sky-800 font-bold px-2 py-0.5 rounded text-[10px]">Men\'s</span>' : ''}
                    ${p.womens ? '<span class="bg-indigo-100 text-indigo-800 font-bold px-2 py-0.5 rounded text-[10px]">Women\'s</span>' : ''}
                  </div>
                  <div class="text-[11px] text-slate-500 font-medium">
                    <i class="fa-solid fa-users text-slate-400"></i> ${p.capacity.toLocaleString()} seats
                  </div>
                </div>
              </div>
            `).join('')}
          </div>
        `;

        conferenceSectionsEl.appendChild(section);
      });
    }
  </script>
</body>
</html>
